# =============================================================================
# Domain: performance
# Entity: Appraisal
# Description: A formal performance appraisal for an employee within a cycle,
#              reviewed by a manager/reviewer. `overall_rating` can drive
#              backbone-payroll merit increases (read-side, no direct write).
# =============================================================================

models:
  - name: Appraisal
    collection: appraisals
    description: "A formal performance appraisal for an employee within a cycle."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]

      employee_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "# logical FK employee.Employee.id"

      cycle_id:
        type: uuid
        attributes: ["@required", "@foreign_key(AppraisalCycle.id)"]
        description: "# FK appraisal_cycles.id (in-module)"

      reviewer_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "# logical FK employee.Employee.id (manager/reviewer)"

      status:
        type: AppraisalStatus
        attributes: ["@required", "@default(draft)"]

      overall_rating:
        type: decimal?
        attributes: ["@precision(3,1)", "@non_negative"]
        description: "Calibrated overall rating (e.g. 1-5 scale)"

      submitted_at:
        type: datetime?
        description: "When the employee self-review / submission was finalized"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]

    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The composing
    # service's tenancy decorator installs the org-scoped lookup indexes.
    indexes:
      - type: index
        fields: [cycle_id]

enums:
  - name: AppraisalStatus
    description: "Appraisal lifecycle."
    variants:
      - name: draft
        default: true
      - name: self_review
      - name: submitted
      - name: calibrated
      - name: finalized
